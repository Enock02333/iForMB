[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifor-mb"
version = "1.0.0"
description = "Isolation Forest evidence fusion and contextual backtracking for log anomaly detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2", "scipy>=1.13,<2", "pyyaml>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
baselines = ["torch>=2.1", "gensim>=4.3,<5", "tqdm>=4.66,<5"]

[project.scripts]
ifor-mb = "ifor_mb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
